name: weekly scan

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run scan
      - run: npm run build
      - name: Commit results
        run: |
          git config user.name "scoreboard-bot"
          git config user.email "actions@github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "scan: $(date -u +%F)"
          git push
